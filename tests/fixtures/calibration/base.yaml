# Base d'expériences FICTIVE pour la mesure des templates de CV (miniatures, calibration).
#
# Persona : Camille Laurent, élève ingénieure en dernière année, profil logiciel & données.
# Volontairement COMPLÈTE (accroche, compétences, langues, formation, 3 expériences, 4
# projets) et TROP FOURNIE : chaque entrée porte plus de puces qu'une page n'en tient, pour
# que ce soit la page mesurée — et non le manque de matière — qui borne le remplissage.
#
# Puces de deux templates, en alternance dans chaque entrée (ordre « mixte ») :
#   - LONGUES : 112 à 120 caractères (au plus 120, plafond max_bullet_chars réel) ;
#   - COURTES : 55 à 65 caractères.
# tests/test_template_previews.py vérifie ces bornes : une puce retouchée hors template
# fausserait silencieusement toute mesure faite sur cette base.
#
# Coordonnées : 4 au plus (e-mail, téléphone, 2 liens). L'en-tête du template de lettre
# « moderne » n'en affiche proprement que 4 ; sa miniature ne doit pas montrer un
# chevauchement que l'écran signalerait comme un défaut.

